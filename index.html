<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디지털세상 - 구글 연동 완료!</title>
    <!-- 구글 로그인 공식 API 라이브러리 불러오기 -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px 50px 20px;
            line-height: 1.6;
            background: #090d16 url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1200') fixed center/cover;
            color: #ffffff;
        }

        /* 메인 헤더 */
        .platform-header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid #2563eb;
            border-top: none;
            padding: 20px 25px;
            border-radius: 0 0 20px 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
        }
        .logo-area { display: flex; align-items: center; gap: 15px; }
        .main-logo-img { height: 60px; border-radius: 12px; object-fit: contain; }
        .logo-title-box h1 { margin: 0; font-size: 22px; color: #60a5fa; }
        .logo-title-box p { margin: 0; font-size: 13px; color: #facc15; font-weight: bold; }

        /* 구글 로그인 영역 디자인 */
        .user-status-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-info {
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(30, 41, 59, 0.9);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #60a5fa;
        }
        .user-profile-pic {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
        .user-name {
            font-size: 13px;
            font-weight: bold;
            color: #f8fafc;
        }
        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
        }

        /* 네온 검색창 */
        .search-box {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #3b82f6;
            padding: 12px 15px;
            border-radius: 14px;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
        }
        .search-input {
            flex: 1; padding: 10px 15px; background: #0f172a;
            border: 1px solid #334155; border-radius: 8px; font-size: 14px; color: white; outline: none;
        }
        .search-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }

        /* 프로필 & 링크 */
        .profile-card {
            background: rgba(30, 41, 59, 0.85); border: 1px solid #475569;
            border-radius: 16px; padding: 20px; margin-bottom: 25px; display: flex; align-items: center; gap: 20px;
        }
        .link-buttons { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .btn { padding: 10px 18px; border-radius: 10px; text-decoration: none; font-size: 13px; font-weight: bold; color: white !important; }
        .btn-google { background-color: #4285F4; }
        .btn-naver { background-color: #03C75A; }
        .btn-insta { background-color: #E1306C; }

        /* 유튜브 및 공지 */
        .youtube-section {
            background: rgba(15, 23, 42, 0.9); border: 1px solid #ef4444;
            padding: 20px; border-radius: 16px; margin-bottom: 30px;
        }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .post { background: rgba(30, 41, 59, 0.85); padding: 20px; border-radius: 12px; border-left: 5px solid #facc15; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- 헤더 영역 -->
    <div class="platform-header">
        <div class="logo-area">
            <img src="logo.jpg" alt="로고" class="main-logo-img" onerror="this.style.display='none'">
            <div class="logo-title-box">
                <h1>디지털세상</h1>
                <p>놀면서 돈벌자! 💰🎮</p>
            </div>
        </div>

        <!-- 우측 상단 구글 로그인 / 연동 영역 -->
        <div class="user-status-box">
            <!-- 로그인 완료 시 노출되는 프로필 정보 -->
            <div id="userInfo" class="user-info">
                <img id="userPic" class="user-profile-pic" src="" alt="프로필">
                <span id="userName" class="user-name"></span>
                <button class="logout-btn" onclick="googleLogout()">로그아웃</button>
            </div>

            <!-- 로그인 버튼 (구글 공식 버튼 생성 위치) -->
            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse">
            </div>
            <div id="googleBtn" class="g_id_signin" data-type="standard" data-size="medium" data-theme="filled_blue"></div>
        </div>
    </div>

    <!-- 검색창 -->
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Google 검색어를 입력하세요..." onkeypress="if(event.keyCode==13) doSearch()">
        <button class="search-btn" onclick="doSearch()">검색</button>
    </div>

    <!-- 프로필 영역 -->
    <header>
        <div class="profile-card">
            <div class="profile-img" style="font-size: 45px;">🤖</div>
            <div class="profile-info">
                <h2 id="welcomeText" style="margin:0; color:#f8fafc;">아인즈토야 (AinzToya)</h2>
                <p style="margin:0; color:#94a3b8; font-size:14px;">상단 구글 버튼을 눌러 계정을 연동해보세요!</p>
            </div>
        </div>

        <div class="link-buttons">
            <a href="https://www.google.com" target="_blank" class="btn btn-google">Google</a>
            <a href="https://www.naver.com" target="_blank" class="btn btn-naver">Naver</a>
            <a href="https://www.instagram.com" target="_blank" class="btn btn-insta">Instagram</a>
        </div>
    </header>

    <!-- 유튜브 영역 -->
    <section class="youtube-section">
        <h2 style="margin-top:0; color:#f87171; font-size:18px;">🎬 디지털세상 인기 영상</h2>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/jfKfPfyJRdk" title="YouTube video player" allowfullscreen></iframe>
        </div>
    </section>

    <!-- 공지 -->
    <main>
        <h2 style="color: #60a5fa;">📢 최근 공지</h2>
        <article class="post">
            <h3 style="margin-top:0; color:#facc15;">🎉 구글 진짜 연동 기능 탑재!</h3>
            <p>이제 구글 계정으로 로그인하면 내 실제 프로필 사진과 이름이 상단에 반영됩니다!</p>
        </article>
    </main>

    <!-- 구글 로그인 응답 처리 스크립트 -->
    <script>
        // 1. Google 로그인 성공 시 실행되는 함수
        function handleCredentialResponse(response) {
            // 구글에서 전달받은 암호화 토큰(JWT) 해독
            const responsePayload = parseJwt(response.credential);

            console.log("로그인 성공:", responsePayload);

            // 사용자의 진짜 프로필 정보 가져오기
            const name = responsePayload.name;
            const picture = responsePayload.picture;

            // UI 업데이트 (로그인 버튼 숨기고 내 프로필 표시)
            document.getElementById('googleBtn').style.display = 'none';
            document.getElementById('userInfo').style.display = 'flex';
            document.getElementById('userName').innerText = name + '님';
            document.getElementById('userPic').src = picture;
            
            // 메인 프로필 인사말 변경
            document.getElementById('welcomeText').innerText = name + '님 환영합니다! 🎉';
        }

        // 2. JWT 암호화 토큰 해독 함수
        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // 3. 로그아웃 기능
        function googleLogout() {
            document.getElementById('googleBtn').style.display = 'block';
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('welcomeText').innerText = '아인즈토야 (AinzToya)';
            alert('로그아웃 되었습니다.');
        }

        // 검색 기능
        function doSearch() {
            const query = document.getElementById('searchInput').value;
            if (query) window.open('https://www.google.com/search?q=' + encodeURIComponent(query), '_blank');
        }
    </script>

</body>
</html>
